# For local development, bringing up just Postgres is enough.
# To run the app as well, use the app profile.
services:
  app:
    profiles: [app]
    build:
      context: .
      args:
        NEXT_PUBLIC_TIMEZONE: ${NEXT_PUBLIC_TIMEZONE:-Asia/Seoul}
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://offon:offon@postgres:5432/offon?schema=public
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      OTP_PEPPER: ${OTP_PEPPER:?set OTP_PEPPER in .env}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET:-}
      SLACK_OFFON_CHANNEL: ${SLACK_OFFON_CHANNEL:-}
      CRON_SECRET: ${CRON_SECRET:-}
      DEFAULT_LOCALE: ${DEFAULT_LOCALE:-ko}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18
    container_name: offon-local-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: offon
      POSTGRES_PASSWORD: offon
      POSTGRES_DB: offon
    ports:
      - "55432:5432"
    volumes:
      - offon-pg-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U offon -d offon"]
      interval: 2s
      timeout: 5s
      retries: 20

volumes:
  offon-pg-data:
