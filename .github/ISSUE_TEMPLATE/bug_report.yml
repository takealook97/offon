name: Bug report
description: Something isn't working
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what happened, and what you expected instead.
    validations:
      required: true
  - type: input
    id: timezone
    attributes:
      label: Your timezone
      description: >
        offon is currently pinned to UTC+9. Most attendance bugs are boundary
        bugs, so this matters more than it looks.
      placeholder: Asia/Seoul
  - type: textarea
    id: env
    attributes:
      label: Where it runs
      placeholder: |
        Deployment: Vercel / Docker / local
        Database: Supabase / Neon / RDS / local Postgres
        Node version:
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Server output around the failure. Redact tokens before pasting.
      render: shell
