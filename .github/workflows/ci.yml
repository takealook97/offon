name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The Prisma client is generated, so it is not in the repository. It has to exist before the type check.
      - run: pnpm exec prisma generate

      - run: pnpm exec tsc --noEmit
      - run: pnpm test
      - run: pnpm lint
