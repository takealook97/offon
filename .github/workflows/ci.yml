name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    # The attendance state machine rests on unique indexes and transactions, so it needs a real Postgres.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: offon
          POSTGRES_PASSWORD: offon
          POSTGRES_DB: offon_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U offon"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The Prisma client is generated, so it is not in the repository. It has to exist before the type check.
      - run: pnpm exec prisma generate

      - run: pnpm exec tsc --noEmit
      - run: pnpm test
      - run: pnpm test:db
        env:
          DATABASE_URL: postgresql://offon:offon@localhost:5432/offon_test?schema=public
      - run: pnpm lint
