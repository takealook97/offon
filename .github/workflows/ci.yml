name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    # The attendance state machine rests on unique indexes and transactions, so it needs a real Postgres.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: offon
          POSTGRES_PASSWORD: offon
          POSTGRES_DB: offon_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U offon"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The Prisma client is generated, so it is not in the repository. It has to exist before the type check.
      - run: pnpm exec prisma generate

      - run: pnpm exec tsc --noEmit
      - run: pnpm test
      - run: pnpm test:db
        env:
          DATABASE_URL: postgresql://offon:offon@localhost:5432/offon_test?schema=public
      - run: pnpm lint

      # End-to-end runs against a real build talking to a real database, so it needs its own,
      # separate from the one the db tests empty between cases.
      - run: createdb -h localhost -U offon offon_e2e
        env:
          PGPASSWORD: offon

      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm build
        env:
          DATABASE_URL: postgresql://offon:offon@localhost:5432/offon_e2e?schema=public

      # next build does not put the static assets beside the standalone server.
      - run: |
          cp -r .next/static .next/standalone/.next/
          cp -r public .next/standalone/

      - run: pnpm test:e2e
        env:
          E2E_DATABASE_URL: postgresql://offon:offon@localhost:5432/offon_e2e?schema=public

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
